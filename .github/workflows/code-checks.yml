name: Code Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Commitlint diffs base..head; needs full history, not a shallow clone.
          fetch-depth: 0

      - uses: ./.github/actions/provision

      - name: Lint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      # Coverage gate (#97): enforces the no-regression floor configured in
      # vitest.config.ts (`coverage.thresholds`). Vitest exits non-zero below
      # the floor. Runs after Unit tests so a plain test failure surfaces first.
      - name: Coverage
        run: pnpm test:coverage

      # Dependency audit gate (#97): fail on high/critical advisories in
      # PRODUCTION dependencies. Known-unfixable transitive advisories are
      # allow-listed in root package.json (`pnpm.auditConfig.ignoreGhsas`) and
      # tracked under #69; any NEW high/critical fails the build.
      - name: Security audit
        run: pnpm audit --prod --audit-level high

      - name: Build
        run: pnpm build

      # First-load JS budget gate (#97): parses Next's per-route build summary
      # and fails on regression past the ceiling in the script. Runs after Build
      # so the web build is warm in the Turbo cache (the script replays it).
      - name: Bundle size budget
        run: node scripts/check-bundle-budget.mjs

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
