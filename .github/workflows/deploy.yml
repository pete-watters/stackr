name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Public PostHog client key — inlined into the browser build by Next.
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/provision

      - name: Build
        run: pnpm build

      - name: Build for Cloudflare
        working-directory: apps/web
        run: npx opennextjs-cloudflare build

      # Production — promote on push to main (serves the custom domain).
      - name: Deploy to production
        if: github.event_name == 'push'
        working-directory: apps/web
        run: npx wrangler deploy

      # Preview — upload a non-production version and surface its URL on the PR.
      - name: Upload preview version
        id: preview
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        run: |
          set -o pipefail
          alias="pr-${{ github.event.number }}"
          npx wrangler versions upload --preview-alias "$alias" 2>&1 | tee deploy.log
          url=$(grep -oE "https://${alias}-[a-z0-9.-]+\.workers\.dev" deploy.log | head -1)
          if [ -z "$url" ]; then
            url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | tail -1)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.preview.outputs.url
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            const marker = '<!-- preview-deployment -->';
            const body = `${marker}\n🚀 **Preview deployment:** ${url}\n\n_Updated for commit ${context.sha.slice(0, 7)}._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
